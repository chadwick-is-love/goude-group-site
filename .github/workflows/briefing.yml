name: The Briefing

# Publishes the weekly issue at 12:01 AM Eastern every Monday.
#
# Runs on Chadwick's Claude subscription via CLAUDE_CODE_OAUTH_TOKEN, not on metered
# API credit. The commit comes from the GitHub runner, so it never touches the sandbox
# git proxy that started refusing pushes in August 2026.
#
# GitHub cron is UTC only, so both DST offsets are scheduled and a guard drops the wrong one.
on:
  schedule:
    - cron: '1 4 * * 1'   # 00:01 America/New_York during EDT
    - cron: '1 5 * * 1'   # 00:01 America/New_York during EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and run the gates, but do not publish'
        type: boolean
        default: false

concurrency:
  group: briefing
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Is it actually 12am Monday in New York
        id: clock
        run: |
          LOCAL=$(TZ=America/New_York date '+%u %H')
          echo "New York time: $(TZ=America/New_York date)"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$LOCAL" != "1 00" ]; then
            echo "Not Monday 00:xx in New York (got '$LOCAL'). This is the other DST cron; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clock.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.clock.outputs.skip != 'true'
        with:
          node-version: '22'

      # setup-token prints a 110-character token and terminals wrap it, so a copy can
      # carry a newline into the repository secret. The API then rejects the
      # Authorization header before any work starts and the run dies in under 30
      # seconds with a bare is_error:true that says nothing. Runs 2 through 8 all died
      # this way. Strip line breaks here so how the token was pasted stops mattering.
      - name: Normalize the OAuth token
        id: tok
        if: steps.clock.outputs.skip != 'true'
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLEAN=$(printf '%s' "$RAW" | tr -d '\r\n')
          if [ -z "$CLEAN" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty or unset. Set the repository secret."
            exit 1
          fi
          echo "::add-mask::$CLEAN"
          echo "value=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "Token normalized: ${#CLEAN} characters, no line breaks."

      - name: Research and write the five articles
        if: steps.clock.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ steps.tok.outputs.value }}
          # Without this the SDK hides the failure reason and you get a bare
          # "is_error: true" with nothing to act on.
          show_full_output: true
          prompt: |
            Follow the instructions in scripts/prompts/write-issue.md exactly.
            Produce build/topics.json and nothing else. Do not edit any HTML,
            do not run the assembler or the gates, do not commit anything.
          claude_args: |
            --max-turns 60

      - name: Did the writing step produce anything
        if: steps.clock.outputs.skip != 'true'
        run: |
          if [ ! -s build/topics.json ]; then
            echo "::error::build/topics.json was not written. The research and writing step produced nothing, so there is no issue to assemble."
            exit 1
          fi
          node -e "JSON.parse(require('fs').readFileSync('build/topics.json','utf8'))" \
            || { echo "::error::build/topics.json is not valid JSON."; exit 1; }
          echo "topics.json is present and parses ($(wc -c < build/topics.json) bytes)"

      - name: Assemble the issue
        if: steps.clock.outputs.skip != 'true'
        run: node scripts/assemble-issue.mjs

      - name: Install Playwright
        if: steps.clock.outputs.skip != 'true'
        run: npm install --no-save playwright@1.49.0 && npx playwright install --with-deps chromium

      - name: Run the gates
        if: steps.clock.outputs.skip != 'true'
        run: node scripts/check-briefing.mjs

      - name: Publish
        id: publish
        if: steps.clock.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          ISSUE=$(node -p "require('./.briefing-build.json').issue")
          SUMMARY=$(node -p "require('./.briefing-build.json').headlines.map(h=>h.domain).join(', ')")
          rm -rf .briefing-build.json build
          git config user.name "The Briefing"
          git config user.email "actions@users.noreply.github.com"
          # Explicit paths only. "git add -A" would sweep node_modules from the
          # Playwright install into a repo that clean-syncs to the live web root.
          git add briefing index.html
          git commit -m "Briefing No. 00${ISSUE}: ${SUMMARY}"
          git push
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Confirm it went live
        if: steps.clock.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          ISSUE="${{ steps.publish.outputs.issue }}"
          for i in 1 2 3 4 5 6; do
            sleep 30
            if curl -s "https://goudegroup.com/briefing/?cb=$(date +%s)" | grep -q "No. 00${ISSUE}"; then
              echo "No. 00${ISSUE} is live."
              exit 0
            fi
            echo "attempt $i: Hostinger has not synced yet"
          done
          echo "::warning::Pushed, but goudegroup.com still served the old issue after 3 minutes. Check the Hostinger deploy."

      - name: Keep the built issue when a dry run finishes
        if: steps.clock.outputs.skip != 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: briefing-dry-run
          path: |
            briefing/index.html
            briefing/archive/index.html
            build/topics.json
          retention-days: 14

      - name: Open an issue if this failed
        if: failure() && steps.clock.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `The Briefing did not publish (${new Date().toISOString().slice(0,10)})`,
              body: [
                'The weekly build failed, so nothing was published and the live site is unchanged.',
                '',
                `Run log: ${url}`,
                '',
                'Most likely causes, in order:',
                '',
                '1. The CLAUDE_CODE_OAUTH_TOKEN secret is missing or expired. The token lasts one year; regenerate with `claude setup-token` and update the secret.',
                '2. The Claude plan hit its usage limit in the rolling window, so the writing step could not run.',
                '3. A gate caught a real defect in the generated issue. That is the system working; read which gate failed.',
                '',
                'To retry after fixing: Actions tab, The Briefing, Run workflow. Tick dry run first to build and gate without publishing.'
              ].join('\n')
            });
