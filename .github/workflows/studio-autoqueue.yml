# STUDIO_AUTOPOST_2026-10-13, made late-proof 2026-10-15 (Kemmet's audit).
# Needs two repository secrets: STUDIO_USER and STUDIO_PASS, a Studio login.
#
# Each run opens the Studio headless and fills gaps: every slot and network
# not yet queued is scheduled in OmniSocials; anything already scheduled,
# rejected or cancelled is left alone. So a run can start hours late, or
# twice, and still only do what is missing.
#
# GitHub fires scheduled jobs on this repo hours late, so these crons are the
# fallback. The on-time trigger is studio/cron.php on Hostinger's cron, which
# starts this workflow (workflow_dispatch) when a slot is open.
#   >gabes: weekdays from 09:20 New York (the signal publishes at 9:00)
#   Goude:  weekdays from 06:05 New York (the Briefing publishes Monday)
name: Studio autoqueue

on:
  schedule:
    - cron: '17,47 10-22 * * 1-5'   # every 30 minutes through the New York working day (both DST offsets; the step below drops runs outside it)
  workflow_dispatch:
    inputs:
      brand:
        description: 'Which side to queue'
        required: true
        type: choice
        options:
          - goude
          - gabes
        default: 'goude'

concurrency:
  group: studio-autoqueue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pick the brands
        id: pick
        run: |
          LOCAL=$(TZ=America/New_York date +%H:%M)
          DOW=$(TZ=America/New_York date +%u)
          BRANDS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANDS="${{ github.event.inputs.brand }}"
          elif [ "$DOW" -le 5 ]; then
            # a late start still does the job: each run fills whatever is open
            if [[ "$LOCAL" > "06:04" && "$LOCAL" < "17:01" ]]; then BRANDS="goude"; fi
            if [[ "$LOCAL" > "09:19" && "$LOCAL" < "17:31" ]]; then BRANDS="$BRANDS gabes"; fi
          fi
          BRANDS=$(echo $BRANDS)
          echo "New York time $LOCAL, brands '${BRANDS:-none}'"
          echo "brand=$BRANDS" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.pick.outputs.brand != ''
        with:
          node-version: '20'
      - name: Install Playwright Chromium
        if: steps.pick.outputs.brand != ''
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Fill the open slots
        if: steps.pick.outputs.brand != ''
        env:
          STUDIO_USER: ${{ secrets.STUDIO_USER }}
          STUDIO_PASS: ${{ secrets.STUDIO_PASS }}
        run: |
          rc=0
          for b in ${{ steps.pick.outputs.brand }}; do
            echo "== $b"; node scripts/studio-autoqueue.mjs "$b" || rc=1
          done
          exit $rc
